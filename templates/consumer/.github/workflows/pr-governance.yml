name: PR Governance

# Managed by ql-pipeline — regenerated by `ql-pipeline upgrade`.
# Local edits are detected and preserved (upgrade will refuse to overwrite
# them and tell you), but they will drift from the template over time.
# Prefer configuring behaviour in .github/pipeline.config.yml instead.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new commit cancels the in-flight run for the previous one, including a
# stale fix-loop attempt. This belongs to the caller, not the reusable
# workflow, because it is a property of *this* repo's runs.
concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# A called workflow can never hold more than its caller. ql-pipeline's jobs
# declare contents/pull-requests/issues write - they label PRs, comment, push
# fix commits and merge - so on a repository whose default GITHUB_TOKEN is
# read-only (GitHub's default) the run fails at startup with NO jobs at all,
# and GitHub exposes no reason for it through the API or the UI. Granting it
# here keeps the widening to this one workflow, rather than flipping the
# repository-wide "Workflow permissions" default and handing write to every
# other workflow in the repo as well.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Job id becomes the check-name prefix: `checks / test`, `checks / build`,
  # `checks / ql-pipeline`. Those exact strings go into branch protection.
  checks:
    uses: 0xb1te/ql-pipeline/.github/workflows/pr-pipeline.yml@main
    # Every secret this repo holds is forwarded to the pipeline. This is
    # deliberate: which secrets ql-pipeline needs is ql-pipeline's business
    # and changes over time (GH_PACKAGES_TOKEN was added after the first
    # consumers were scaffolded). Listing them here would mean editing every
    # governed repo each time that set changes. See docs/integration-guide.md
    # for which secrets to actually create on the repository.
    secrets: inherit
