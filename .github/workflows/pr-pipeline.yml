name: PR Pipeline

# This is the product: a reusable workflow other repos call by reference
# (see docs/integration-guide.md). It never runs on its own — a caller
# workflow (a consumer repo's, or this repo's own dogfood.yml) triggers it
# with `uses:`.
#
# It reports THREE checks on a PR, in order:
#   1. test        — the configured test gate for the PR's areas
#   2. build       — the configured build gate for the PR's areas
#   3. ql-pipeline — AI review, verdict, and merge / fix / block
#
# The gate jobs hand their results to the pipeline job as artifacts rather
# than simply halting the chain, because a broken build is a finding the
# fix agent can repair — see docs/008-modular-checks/plan.md.
on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the pipeline config file, resolved in the calling repository.
        type: string
        default: .github/pipeline.config.yml
      ql-pipeline-ref:
        description: Git ref of ql-pipeline to run. Pin a tag/sha in production consumers.
        type: string
        default: main
      standards-repo:
        description: >-
          Repository holding the engineering standards the reviewer applies
          (the prompt-utils workflow docs). Set to an empty string to review
          without standards — also set `standards.enabled: false` in the
          pipeline config if you do.
        type: string
        default: 0xb1te/prompt-utils
      standards-ref:
        description: Git ref of the standards repository to apply.
        type: string
        default: main
    secrets:
      CURSOR_API_KEY:
        description: Cursor CLI API key, used for the AI review and the auto-fix agent.
        required: true
      GH_TOKEN:
        description: Token used to read PR data, manage labels/reviews, and push fix commits. Falls back to the calling workflow's default GITHUB_TOKEN.
        required: false
      STANDARDS_TOKEN:
        description: >-
          Token with read access to the standards repository. Required when
          it is private — the default GITHUB_TOKEN is scoped to the repo
          under review and cannot read another one. Falls back to GH_TOKEN.
        required: false

jobs:
  # ---------------------------------------------------------------- 1/3 --
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Checkout ql-pipeline
        uses: actions/checkout@v4
        with:
          repository: 0xb1te/ql-pipeline
          ref: ${{ inputs.ql-pipeline-ref }}
          path: .ql-pipeline

      # `actions/checkout` can only write inside the workspace, so
      # ql-pipeline (and the node_modules it installs) lands inside the repo
      # under review. Hiding it here keeps it out of `git status`, which the
      # reviewer's read-only guard and the fixer's staging both depend on.
      - name: Hide the ql-pipeline checkout from the repo under review
        run: echo '/.ql-pipeline/' >> .git/info/exclude

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .ql-pipeline/package-lock.json

      - name: Install and build ql-pipeline
        working-directory: .ql-pipeline
        run: npm ci && npm run build

      - name: Run test gate
        run: node .ql-pipeline/dist/main.js gate --stage test --report gate-reports/test.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PIPELINE_CONFIG_PATH: ${{ inputs.config-path }}

      # `always()` so a failing gate still hands its output to the pipeline
      # job, which needs the error text to drive a fix.
      - name: Upload test gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-test
          path: gate-reports/test.json
          if-no-files-found: ignore
          retention-days: 1

  # ---------------------------------------------------------------- 2/3 --
  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Checkout ql-pipeline
        uses: actions/checkout@v4
        with:
          repository: 0xb1te/ql-pipeline
          ref: ${{ inputs.ql-pipeline-ref }}
          path: .ql-pipeline

      - name: Hide the ql-pipeline checkout from the repo under review
        run: echo '/.ql-pipeline/' >> .git/info/exclude

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .ql-pipeline/package-lock.json

      - name: Install and build ql-pipeline
        working-directory: .ql-pipeline
        run: npm ci && npm run build

      - name: Run build gate
        run: node .ql-pipeline/dist/main.js gate --stage build --report gate-reports/build.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PIPELINE_CONFIG_PATH: ${{ inputs.config-path }}

      - name: Upload build gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-build
          path: gate-reports/build.json
          if-no-files-found: ignore
          retention-days: 1

  # ---------------------------------------------------------------- 3/3 --
  ql-pipeline:
    name: ql-pipeline
    needs: [test, build]
    # Runs even when a gate failed (but not when the run was cancelled):
    # the gate results become findings the fix agent can act on. Halting
    # here on a red gate would mean a broken build is never auto-fixed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Checkout ql-pipeline
        uses: actions/checkout@v4
        with:
          repository: 0xb1te/ql-pipeline
          ref: ${{ inputs.ql-pipeline-ref }}
          path: .ql-pipeline

      # The engineering standards the reviewer judges against. A private
      # standards repo needs STANDARDS_TOKEN — the default GITHUB_TOKEN is
      # scoped to the repo under review and cannot read another one.
      # `continue-on-error` so that a failure here surfaces as the
      # pipeline's own explanatory message rather than a bare checkout
      # error; the review then refuses to proceed without its standards.
      - name: Checkout engineering standards
        if: ${{ inputs.standards-repo != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.standards-repo }}
          ref: ${{ inputs.standards-ref }}
          token: ${{ secrets.STANDARDS_TOKEN || secrets.GH_TOKEN || github.token }}
          path: .standards

      - name: Hide the ql-pipeline and standards checkouts from the repo under review
        run: |
          echo '/.ql-pipeline/' >> .git/info/exclude
          echo '/.standards/' >> .git/info/exclude

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .ql-pipeline/package-lock.json

      - name: Install and build ql-pipeline
        working-directory: .ql-pipeline
        run: npm ci && npm run build

      # A gate job that was skipped leaves no artifact; the pipeline job
      # treats an absent report as "that stage did not report", which is
      # different from "that stage passed".
      - name: Download gate reports
        uses: actions/download-artifact@v4
        with:
          pattern: gate-report-*
          merge-multiple: true
          path: gate-reports
        continue-on-error: true

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Cursor CLI is on PATH
        run: cursor-agent --version

      # The fix agent commits through pipeline code, so the runner needs a
      # git identity or `git commit` fails outright.
      - name: Configure git identity for fix commits
        run: |
          git config user.name 'ql-pipeline[bot]'
          git config user.email 'ql-pipeline[bot]@users.noreply.github.com'

      - name: Review, decide, and act
        run: node .ql-pipeline/dist/main.js govern --reports gate-reports
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PIPELINE_CONFIG_PATH: ${{ inputs.config-path }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
