cns: "1.0"
neuron: governCommand
kind: function
region: entrypoint
layer: cli
unit: src/cli/govern-command.ts

responsibility: >
  The pipeline check: routes the PR, loads rules and standards, runs the AI review, decides
  MERGE/FIX/BLOCK from the combined gate and review findings, and carries that decision out -
  merge, push a fix commit, or escalate to a human - posting an audit-trail comment either way.

owns:
  - The escalate-to-human path (needs-human label plus an explanatory PR comment) every failure mode short of a clean MERGE funnels through
excludes:
  - Any gate's own build/test execution - this runs even when a gate job failed, to turn a broken build into a fixable finding

receptors:
  - kind: cli
    stimulus: process start (node dist/main.js govern)
    signal: runGovern

effectors:
  - kind: log
    target: stdout/stderr, and a GitHub Actions setFailed annotation on any non-merge outcome
    signal: runGovern
    effect: logs routing, rules, standards, and review progress, and fails the check for anything short of a clean merge
  - kind: filesystem
    target: prompts/reviewer.md and prompts/fixer.md under ql-pipeline's own installed package root
    signal: runGovern
    effect: reads the prompt templates injected into the reviewer and fixer invocations

signals:
  - signal: readGateReports
    intent: >
      Reads and merges every gate-stage report left in a directory; a report that is present but
      unreadable is fatal, since the pipeline would otherwise merge a PR without knowing whether
      its tests actually passed.
    accepts: "reportsDir, reader?"
    returns: "{ ok: true, outcomes } | { ok: false, reason }"
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
      - from: mcp.server.inspect#runInspectTool
        via: direct-call
    efferent:
      - to: shared.core.gateReport#parseGateReport
        via: direct-call
        because: validates each report file's shape rather than trusting it
      - to: shared.core.gateReport#mergeGateReports
        via: direct-call
        because: combines every stage's reports into one outcome list, test before build

  - signal: complaintReview
    intent: >
      The whole request-changes review - the body, and the comments GitHub will actually accept.
      One function rather than two calls, because the two have to agree and once did not. A `must`
      finding on a pseudo-path, which is what every failed required gate is, was sent to
      requestChangesWithComments unfiltered and 422'd the run that existed to explain it. The filter
      had been written, for the approval path, and the blocking path simply did not use it.
      Returning both together means the findings left out of the comments are reported in the
      summary by construction rather than by a caller remembering to pass them.
    accepts: "readonly Finding[], attemptNumber, maxFixAttempts, readonly Finding[]"
    returns: "summary and comments"
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent:
      - to: fix.fixer.complaint#formatComplaintSummary
        via: direct-call
        because: renders the body, including in full the findings that have nowhere to point
      - to: merge.merger.merger#inlineComments
        via: direct-call
        because: the one rule for which findings GitHub will accept a comment on
      - to: merge.merger.merger#unanchoredFindings
        via: direct-call
        because: the complement, handed to the body so nothing is dropped

  - signal: runGovern
    intent: >
      Runs the pipeline check end to end: routes the PR, checks for protected-path edits, reads
      the gate reports, runs the AI review when required (cursor-agent or the OpenAI-compatible
      HTTP reviewer), decides the verdict, and carries it out - escalating a FIX to a human when
      the review ran against openai_compatible, because the fixer is still Cursor-only.
    accepts: reportsDir
    returns: "Promise<void>"
    afferent:
      - from: entrypoint.main.main#main
        via: direct-call
    efferent:
      - to: shared.core.humanDirection#formatDirection
        via: direct-call
        because: the reviewer and the fixer both read what people said on the PR, and the pipeline's own comments must be filtered out before either does
      - to: review.reviewer.findingReply#replyForFinding
        via: direct-call
        because: a finding that is fixed but never answered leaves its thread reading as an open complaint
      - to: entrypoint.cli.bootstrap#createPipelineContext
        via: direct-call
        because: needs the config, PR, and GitHub client before it can do anything
      - to: entrypoint.cli.bootstrap#resolveRouting
        via: direct-call
        because: decides whether this PR is in scope and what it routes to, independently of the gate jobs
      - to: shared.core.githubClient#createGithubClient
        via: di
        because: every PR comment, label, changed-file list, commit list, and review call this signal makes is whatever createGithubClient's Octokit-backed implementation returns
      - to: routing.router.areaPaths#areasFromPaths
        via: direct-call
        because: adds areas implied by the code the PR actually touches on top of what its commit headers declare
      - to: routing.router.selfProtection#touchesProtectedPaths
        via: direct-call
        because: RULES.md R4 - a PR touching pipeline-governance paths always needs a human, checked before the AI is ever consulted
      - to: entrypoint.cli.governCommand#previewEnvironmentFindings
        via: direct-call
        because: a product repository with no preview environment fails structurally, before the gates are read or a model is asked anything
      - to: entrypoint.cli.governCommand#previewEnvironmentRefusal
        via: direct-call
        because: what the pull request is told when it fails on the preview environment contract
      - to: entrypoint.cli.governCommand#readGateReports
        via: direct-call
        because: needs to know whether the PR's build and test gates passed before deciding anything
      - to: verdict.decision.requiredChecks#gateFindings
        via: direct-call
        because: turns failed gates into findings so a build break flows through the same verdict path as a review finding
      - to: verdict.decision.requiredChecks#isReviewRequired
        via: direct-call
        because: skips the AI review outright when ai-review isn't a required check - a review whose findings can't block is pure cost
      - to: rules.resolver.ruleResolver#resolveRuleFiles
        via: direct-call
        because: resolves which .rules files apply to this PR's matched areas
      - to: rules.resolver.ruleResolver#formatRulesForPrompt
        via: direct-call
        because: renders the resolved rules into the block injected into the reviewer prompt
      - to: rules.resolver.ruleResolver#ruleFileIds
        via: direct-call
        because: names which rule files the reviewer may cite, for the grounding check
      - to: standards.reader.reviewKind#reviewKindFor
        via: direct-call
        because: picks which workflow/review/pr-* pack this PR's branch and commit types load
      - to: standards.reader.houseCredentials#readHouseCredentialsFromEnv
        via: direct-call
        because: reads the four QL_HOUSE_API_URL/QL_AUTH_* variables this run needs to reach house-api
      - to: standards.reader.houseCredentials#createHouseStandardsReader
        via: direct-call
        because: mints this run's own house-api session credentials and builds the reader standards resolution will read through
      - to: standards.reader.standardsResolver#resolveStandards
        via: direct-call
        because: loads the review pack for this PR's kind and areas, from house-api
      - to: standards.reader.standardsResolver#formatStandardsForPrompt
        via: direct-call
        because: renders the resolved standards into the block injected into the reviewer prompt
      - to: standards.reader.standardsResolver#standardsIds
        via: direct-call
        because: names which standards documents the reviewer may cite, for the grounding check
      - to: review.reviewer.openaiCompatibleRunner#readAgentApiKeyFromEnv
        via: direct-call
        because: when agent.provider is openai_compatible, the bearer token comes from the environment, never from YAML
      - to: review.reviewer.openaiCompatibleRunner#createOpenAiCompatibleReviewer
        via: direct-call
        because: when agent.provider is openai_compatible, builds the HTTP reviewer injected into runReview
      - to: review.reviewer.reviewer#runReview
        via: direct-call
        because: runs the AI reviewer against this PR's diff, rules, standards, and gate results
      - to: entrypoint.cli.governCommand#shouldSkipCursorFixer
        via: direct-call
        because: a FIX after an OpenAI-compatible review must escalate rather than pretend an HTTP completion can write a fix commit
      - to: fix.fixer.attemptCounter#countFixAttempts
        via: direct-call
        because: counts prior [bot] fix commits already on this PR, to know which attempt this is
      - to: verdict.decision.verdict#decidePipelineOutcome
        via: direct-call
        because: the one place MERGE/FIX/BLOCK is actually decided, from every finding gathered so far
      - to: shared.core.auditSummary#formatAuditSummary
        via: direct-call
        because: renders this run's audit-trail PR comment, posted regardless of the decision
      - to: merge.merger.merger#executeMergeDecision
        via: direct-call
        because: carries out a MERGE verdict against GitHub
      - to: entrypoint.cli.governCommand#complaintReview
        via: direct-call
        because: builds the whole request-changes review at once, so the body and the comments cannot disagree about which findings were reported
      - to: merge.merger.merger#recordComplaint
        via: direct-call
        because: posts that review, falling back to a comment when GitHub refuses a self-requested change rather than throwing the run away
      - to: fix.fixer.fixer#runFix
        via: direct-call
        because: runs the automated fix attempt for a FIX verdict on a non-fork PR when the provider is still cursor
      - to: fix.fixer.agentsFixer#agentsFixerCredentialsFromEnv
        via: direct-call
        because: the ql_agents provider is refused loudly when the fleet publishes no ql-agents, rather than failing mid-dispatch
      - to: fix.fixer.agentsFixer#runAgentsFix
        via: direct-call
        because: agent.provider ql_agents dispatches the fix to the suite's agent runner instead of spawning a CLI here
      - to: review.reviewer.findingReply#pickedUpReply
        via: direct-call
        because: every thread this review opened is told which run picked the findings up, the moment the run id exists
      - to: entrypoint.cli.governCommand#taskProvenanceFindings
        via: direct-call
        because: asks whether anybody planned this pull request, after the review rather than before it - the answer is advisory and must not stand between a PR and the review that judges its code
      - to: entrypoint.cli.governCommand#taskArtifactFindings
        via: direct-call
        because: checks the task folder structurally, ahead of both the R4 escalation and the AI, so whether a required file exists is never something a reviewer can be talked out of
      - to: entrypoint.cli.governCommand#protectedPathsComment
        via: direct-call
        because: an R4 escalation returns before the review and the verdict, so the structural findings have to travel in its own comment or be reported nowhere
      - to: notify.sprint.sprintNotifier#sprintNotifierCredentialsFromEnv
        via: direct-call
        because: a fleet that publishes no ql-sprint has nobody to tell and nothing to ask, which is ordinary rather than a misconfiguration
      - to: notify.sprint.sprintNotifier#createSprintNotifier
        via: direct-call
        because: posts what this run decided so the verdict reaches the operator in Telegram - best-effort, because a review that has already landed must not be undone by the messenger

  - signal: taskProvenanceFindings
    intent: >
      Asks ql-sprint whether this pull request is a task anybody planned, and turns a "no" into one
      advisory finding. Three silences, and only one of them is a finding. No ql-sprint configured
      at all says nothing, not even a log line - a repository governed by a fleet that runs no
      orchestrator has no sprint board to be missing from, exactly as it has no Telegram to be
      notified in. ql-sprint configured but unreachable warns and raises nothing, because absence
      of evidence is not evidence and a network that was down must never be reported on a pull
      request as "nobody asked for this". Only ql-sprint answering, and knowing nothing about this
      pull request, is the finding.
    accepts: "pr, logger, env?, readTasks?"
    returns: "Promise<Finding[]>"
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent:
      - to: notify.sprint.sprintNotifier#sprintNotifierCredentialsFromEnv
        via: direct-call
        because: reuses the credentials the notifier already needs rather than inventing a second way to reach ql-sprint
      - to: notify.sprint.sprintTasks#readSprintTasks
        via: direct-call
        because: reads the tracked task list, failing open so an unreachable ql-sprint cannot cost a review that otherwise passed
      - to: verdict.decision.taskProvenance#decideTaskProvenance
        via: direct-call
        because: the pure decision that matches a pull request to a task, so the question is answerable in a test without a network
      - to: verdict.decision.taskProvenance#taskProvenanceFinding
        via: direct-call
        because: renders a no-task answer as the `should` finding that rides along on a MERGE as an advisory comment

  - signal: taskArtifactFindings
    intent: >
      Asks whether the task folder this branch names carries the test plan and the seed data an
      automated tester needs, and turns a "no" into one finding. Structural, and run before the R4
      escalation as well as before the AI review, for the reason R4 itself is - whether a file
      exists is not a judgement, and making a reviewer the enforcement mechanism for one turns an
      unarguable check into a negotiable opinion. The two questions are orthogonal: running after
      R4 meant a governance pull request returned before this ever ran, so the pull requests that
      get the most human attention were the only ones whose task folder went unchecked. Unlike the protected-paths check it does not escalate to a human: a
      missing test plan is not something a person adjudicates, the author adds the file. It also
      does not skip the review the way a red gate does, because a folder missing its test plan
      says nothing about whether the code is worth reviewing.
    accepts: "pr, consumerRoot, requiredChecks, logger"
    returns: "readonly Finding[]"
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent:
      - to: verdict.decision.taskArtifacts#taskFolderRefOf
        via: direct-call
        because: the branch is the only thing that says which task folder to look in, and it is derived rather than configured
      - to: verdict.decision.taskArtifacts#taskFolderGlobFor
        via: direct-call
        because: logs the same glob the finding names, so the run log and the pull request comment agree
      - to: verdict.decision.taskArtifacts#taskArtifactFinding
        via: direct-call
        because: the pure decision, given the folder listing this signal read, so the check is testable without a disk

  - signal: protectedPathsComment
    intent: >
      Composes what the R4 escalation says, plus any structural finding a person should see while
      they are already looking. The escalation returns before the review, the gates and the verdict
      ever run, so whatever this comment omits is reported nowhere else on that pull request - a
      task folder missing its test plan was, until this carried it, silently unchecked on exactly
      the pull requests that get the most human attention. Kept pure and apart from escalateToHuman
      so the composition is testable without a GitHub client, the same way complaintReview is.
    accepts: "artifactFindings - every structural finding, task artifacts and preview environment alike"
    returns: string
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent: []

  - signal: previewEnvironmentFindings
    intent: >
      Asks whether a product repository carries the preview environment ql-docs mandates, and
      turns a "no" into one finding. Structural and before the AI is consulted, for the reason R4
      is - whether a folder exists and names an edge service is not a judgement. Computed ahead of
      the R4 escalation so a person summoned to review a governance change also sees that the
      repository cannot be previewed, rather than discovering it on the next pull request.
    accepts: "consumerRoot, areaPaths, logger"
    returns: "readonly Finding[]"
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent:
      - to: verdict.decision.previewEnvironment#readPreviewEnvironmentSnapshot
        via: direct-call
        because: the one reader of the apps listing and the devops folder, shared with doctor
      - to: verdict.decision.previewEnvironment#assessPreviewEnvironment
        via: direct-call
        because: the pure verdict, given what was read, so the check is testable without a disk
      - to: verdict.decision.previewEnvironment#previewEnvironmentFinding
        via: direct-call
        because: renders an invalid verdict as the one finding the refusal carries

  - signal: previewEnvironmentRefusal
    intent: >
      What the pull request is told when its repository has no valid preview environment. A hard
      failure and not a `must` finding, deliberately - a finding rides into the verdict, which is
      reached only after the gates are read and the review has run, so a repository that cannot
      be previewed would still spend a review and could be argued back to MERGE by an attempt cap.
      Nothing downstream can work without the folder, so nothing downstream is spent on it. Not
      an escalation either - a missing folder is fixed by its author, not adjudicated by a person
      - so the pull request fails and says what is missing, exactly as an unroutable one does.
    accepts: "readonly Finding[]"
    returns: string
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent: []

  - signal: shouldSkipCursorFixer
    intent: >
      Answers whether a FIX verdict must escalate to a human because the review ran against an
      OpenAI-compatible endpoint that cannot write a fix commit.
    accepts: AgentProvider
    returns: boolean
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent: []

provenance:
  - docs/bugfixes/051-dogfood-runs-main-not-the-pr/summary.md

revision: 2026-09-22
