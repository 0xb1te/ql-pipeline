name: PR Pipeline

# This is the product: a reusable workflow other repos call by reference
# (see docs/integration-guide.md). It never runs on its own — a caller
# workflow (a consumer repo's, or this repo's own dogfood.yml) triggers it
# with `uses:`.
#
# It reports FIVE checks on a PR, in order:
#   1. test           — the configured test gate for the PR's areas
#   2. build          — the configured build gate for the PR's areas
#   3. ql-pipeline    — AI review, verdict, and merge / fix / block
#   4. preview        — on a green verdict, the PR's devops stack brought up
#                       through ql-proxy on the preview host (self-hosted)
#   5. preview-tester — the task's MCP cases driven against that stack
#
# Plus preview-teardown, which is not a check on the PR: it runs when the PR
# closes and collects the stack at once instead of on the host reaper's timer.
#
# The gate jobs hand their results to the pipeline job as artifacts rather
# than simply halting the chain, because a broken build is a finding the
# fix agent can repair — see docs/008-modular-checks/plan.md.
on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the pipeline config file, resolved in the calling repository.
        type: string
        default: .github/pipeline.config.yml
      ql-pipeline-ref:
        description: >-
          Git ref of ql-pipeline to run. Pin a tag/sha in production consumers. Ignored when the
          calling repository is ql-pipeline itself: a pull request here is governed by its own
          head, never by this ref, so the dogfood check exercises the code under review
          (docs/bugfixes/051-dogfood-runs-main-not-the-pr/).
        type: string
        default: main
    secrets:
      CURSOR_API_KEY:
        description: Cursor CLI API key, used when agent.provider is cursor (the default) for AI review and auto-fix. Optional when review uses an OpenAI-compatible endpoint, but still required for the fixer.
        required: false
      QL_PIPELINE_AGENT_API_KEY:
        description: Bearer token for agent.provider openai_compatible. Preferred over OPENAI_API_KEY. Never put this in pipeline.config.yml.
        required: false
      OPENAI_API_KEY:
        description: Fallback bearer token for agent.provider openai_compatible when QL_PIPELINE_AGENT_API_KEY is unset.
        required: false
      GH_TOKEN:
        description: Token used to read PR data, manage labels/reviews, and push fix commits. Falls back to the calling workflow's default GITHUB_TOKEN.
        required: false
      GH_PACKAGES_TOKEN:
        description: Token with read access to the private 0xb1te/ql-docs and 0xb1te/ql-auth repositories, which ql-pipeline installs its house-api and ql-auth clients from. Required until those repositories are public - without it every job fails at install.
        required: false
      # The engineering standards the reviewer judges against are read from
      # house-api over HTTP, not a checkout of ql-docs — see
      # docs/013-house-backed-standards/plan.md. These four are only read by
      # the `ql-pipeline` job's `govern` step; `test`/`build` never need them.
      # All four can be omitted only when the consumer's pipeline config sets
      # `standards.enabled: false`.
      QL_HOUSE_API_URL:
        description: Origin house-api is reachable at (e.g. https://house.example.com).
        required: false
      HOUSE_API_URL:
        description: Deprecated pre-020 spelling of QL_HOUSE_API_URL. Still read when the prefixed name is unset, so an existing consumer keeps working until it renames the secret. Will be removed.
        required: false
      QL_AUTH_URL:
        description: Origin ql-auth is reachable at (e.g. https://auth.example.com).
        required: false
      QL_AUTH_CLIENT_ID:
        description: Client id of a ql-auth `github_agent` client-credentials client.
        required: false
      QL_AUTH_CLIENT_SECRET:
        description: Client secret for QL_AUTH_CLIENT_ID.
        required: false
      QL_PROXY_TOKEN:
        description: Shared secret for a ql-proxy exposure published with --protect, sent as X-QL-Proxy-Token in front of both QL_HOUSE_API_URL and QL_AUTH_URL. Omit when those addresses are public or private-network only.
        required: false
      QL_AUTH_PROXY_TOKEN:
        description: Secret of the ql-proxy exposure in front of QL_AUTH_URL, when it differs from the one in front of house-api. ql-proxy gives every protected exposure a secret of its own, so two separately published addresses need two secrets. Falls back to QL_PROXY_TOKEN when unset.
        required: false
      QL_HOUSE_PROXY_TOKEN:
        description: Secret of the ql-proxy exposure in front of QL_HOUSE_API_URL, when it differs from the one in front of ql-auth. Falls back to QL_PROXY_TOKEN when unset.
        required: false
      QL_SPRINT_URL:
        description: Origin ql-sprint is reachable at (e.g. https://sprint.example.com). Set it and this pipeline tells ql-sprint what it decided about each PR, which reaches the operator in Telegram. Omit it entirely on a fleet that runs no ql-sprint - governance is unaffected either way.
        required: false
      QL_SPRINT_PROXY_TOKEN:
        description: Secret of the ql-proxy exposure in front of QL_SPRINT_URL. A third exposure holds a third secret; falls back to QL_PROXY_TOKEN when unset, and is simply absent when ql-sprint is published unprotected.
        required: false

jobs:
  # ---------------------------------------------------------------- 0/6 --
  # Which pull request is this run about, and should it run at all?
  #
  # A `pull_request` event answers both in its payload. An `issue_comment` —
  # how a person asks for another pass by writing on the PR — answers
  # neither: GitHub sends it with an `issue`, so there is no head ref to
  # check out and no base branch to route against until somebody asks the
  # API. Asking once here, and handing the answer to all three jobs, keeps
  # the rest of this file free of per-event branching: every job below
  # checks out `needs.resolve.outputs.*` and never reads `github.event`.
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.pr.outputs.run }}
      number: ${{ steps.pr.outputs.number }}
      title: ${{ steps.pr.outputs.title }}
      head-repo: ${{ steps.pr.outputs.head-repo }}
      head-ref: ${{ steps.pr.outputs.head-ref }}
      head-sha: ${{ steps.pr.outputs.head-sha }}
      base-ref: ${{ steps.pr.outputs.base-ref }}
      is-fork: ${{ steps.pr.outputs.is-fork }}
      # Which ql-pipeline every job below checks out into `.ql-pipeline/`.
      # Resolved here, once, next to the PR itself - because for one caller
      # the answer IS the PR. See the end of the script.
      ql-pipeline-repo: ${{ steps.pr.outputs.ql-pipeline-repo }}
      ql-pipeline-ref: ${{ steps.pr.outputs.ql-pipeline-ref }}
    steps:
      - id: pr
        uses: actions/github-script@v7
        env:
          # Read from the environment rather than interpolated into the
          # script, so a ref with a quote in it cannot break the JavaScript.
          QL_PIPELINE_REF: ${{ inputs.ql-pipeline-ref }}
        with:
          github-token: ${{ secrets.GH_TOKEN || github.token }}
          script: |
            // Declining is normal, not a failure: most comments on most
            // repositories are not a request for another pass. A skipped run
            // says why in the summary and leaves the PR's checks alone.
            const decline = (why) => {
              core.notice(`ql-pipeline is not running: ${why}`);
              core.setOutput('run', 'false');
            };

            // The loop guard, and the reason this whole feature is safe to
            // leave on. The pipeline answers each of its own findings in the
            // thread that raised it and comments its verdict on the PR; if
            // those comments triggered runs, every run would trigger the next
            // one and the PR would never come to rest. Only a person can ask
            // for another pass.
            //
            // This runs before the PR is resolved, and so covers BOTH comment
            // events — `pull_request_review_comment` arrives with a full
            // `pull_request` payload, so a guard living in the lookup branch
            // below would never see the pipeline's own thread replies.
            if (context.eventName === 'issue_comment' || context.eventName === 'pull_request_review_comment') {
              if (context.payload.action === 'deleted') {
                return decline('the comment was deleted.');
              }
              const body = String(context.payload.comment?.body ?? '');
              // The guard that still works once GH_TOKEN is set. The workflow then acts as that
              // token's owner — a person, and usually the same person who comments here — so its
              // own verdicts arrive as an ordinary user comment and no identity check can tell
              // them apart. The marker can: ql-pipeline stamps everything it writes, and nothing
              // a person types carries it.
              if (body.includes('<!-- ql-pipeline:automated -->')) {
                return decline('that comment is one this pipeline wrote, and answering itself would never stop.');
              }
              const author = context.payload.comment?.user ?? {};
              const login = String(author.login ?? 'an unknown account');
              // Still worth keeping for every other bot on the repository, and for a pipeline
              // running without GH_TOKEN, whose comments arrive as github-actions[bot].
              if (author.type === 'Bot' || login.endsWith('[bot]')) {
                return decline(`${login} is a bot, and a pipeline that replied to itself would never stop.`);
              }
              if (body.trim() === '') {
                return decline('the comment is empty.');
              }
            }

            let pr = context.payload.pull_request;

            if (pr === undefined) {
              if (context.eventName !== 'issue_comment') {
                return decline(`a ${context.eventName} event carries no pull request.`);
              }
              const issue = context.payload.issue ?? {};
              if (!issue.pull_request) {
                return decline(`#${issue.number} is an issue, not a pull request.`);
              }
              const found = await github.rest.pulls.get({ ...context.repo, pull_number: issue.number });
              pr = found.data;
            }

            if (pr.state !== 'open') {
              return decline(`PR #${pr.number} is ${pr.state}.`);
            }
            // A deleted fork leaves `head.repo` null, and there is then no
            // repository to check the branch out of — not even to review it.
            if (pr.head.repo === null) {
              return decline(`PR #${pr.number} comes from a deleted fork, so there is nothing to check out.`);
            }

            const isFork = pr.head.repo.full_name !== pr.base.repo.full_name;
            core.setOutput('run', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title ?? '');
            core.setOutput('head-repo', pr.head.repo.full_name);
            core.setOutput('head-ref', pr.head.ref);
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('base-ref', pr.base.ref);
            core.setOutput('is-fork', isFork ? 'true' : 'false');

            // Which ql-pipeline runs. A consumer runs the ref it pinned. When
            // the calling repository is ql-pipeline itself, the pull request
            // IS the ql-pipeline under test, so it runs its own head - the same
            // repository and ref the jobs check out as the repo under review.
            // Before this, dogfood ran `main`'s dist/main.js against the
            // branch's YAML: a PR changing govern, gate or tester code was
            // never once exercised by its own check (run 35728255439 on #43
            // logged 0.5.1's lines against a 0.6.0 branch). Resolved here
            // rather than in dogfood.yml because `github.head_ref` is empty on
            // both comment events, and the caller cannot forget an input it
            // does not have to set.
            const governsItself = `${context.repo.owner}/${context.repo.repo}` === '0xb1te/ql-pipeline';
            core.setOutput('ql-pipeline-repo', governsItself ? pr.head.repo.full_name : '0xb1te/ql-pipeline');
            core.setOutput('ql-pipeline-ref', governsItself ? pr.head.ref : process.env.QL_PIPELINE_REF);
            if (governsItself) {
              core.notice(`ql-pipeline governs itself: running ${pr.head.repo.full_name}@${pr.head.ref}, not ql-pipeline-ref.`);
            }
            core.notice(
              `Governing PR #${pr.number} — ${pr.head.ref} @ ${pr.head.sha.slice(0, 7)} into ${pr.base.ref}` +
                `${isFork ? ' (from a fork: review only, no fix commits)' : ''}, triggered by ${context.eventName}.`,
            );

  # ---------------------------------------------------------------- 1/6 --
  test:
    name: test
    needs: resolve
    if: ${{ needs.resolve.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # `gate` routes the PR the same way `govern` does, so it needs the same
    # answer to "which PR is this?" on an event that did not carry one.
    env:
      QL_PIPELINE_PR_NUMBER: ${{ needs.resolve.outputs.number }}
      QL_PIPELINE_PR_TITLE: ${{ needs.resolve.outputs.title }}
      QL_PIPELINE_PR_HEAD_REF: ${{ needs.resolve.outputs.head-ref }}
      QL_PIPELINE_PR_HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
      QL_PIPELINE_PR_BASE_REF: ${{ needs.resolve.outputs.base-ref }}
      QL_PIPELINE_PR_IS_FORK: ${{ needs.resolve.outputs.is-fork }}
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.head-repo }}
          ref: ${{ needs.resolve.outputs.head-ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Checkout ql-pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.ql-pipeline-repo }}
          ref: ${{ needs.resolve.outputs.ql-pipeline-ref }}
          path: .ql-pipeline

      # `actions/checkout` can only write inside the workspace, so
      # ql-pipeline (and the node_modules it installs) lands inside the repo
      # under review. Hiding it here keeps it out of `git status`, which the
      # reviewer's read-only guard and the fixer's staging both depend on.
      #
      # Hiding it from git is not enough for pnpm, though: pnpm finds its
      # workspace by walking UP the directory tree, so inside a consumer that
      # is itself a pnpm workspace it reads the consumer's
      # pnpm-workspace.yaml and installs THAT, ignoring ql-pipeline's own
      # package.json entirely. The build then fails on missing @actions/core
      # and yaml. Every install below therefore passes --ignore-workspace,
      # which is a no-op in a consumer that is not a workspace.
      - name: Hide the ql-pipeline checkout from the repo under review
        run: echo '/.ql-pipeline/' >> .git/info/exclude

      # No hard `version:` — it contradicts the `packageManager` field and
      # pnpm refuses to guess between them (ERR_PNPM_BAD_PM_VERSION). The
      # file it reads is ql-pipeline's own, not the consumer repo's root
      # package.json, which may pin a different pnpm or not exist at all.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .ql-pipeline/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: .ql-pipeline/pnpm-lock.yaml

      # ql-pipeline installs @0xb1te/house-client and @0xb1te/ql-auth-client
      # straight from the private 0xb1te/ql-docs and 0xb1te/ql-auth repos.
      # The calling repo's GITHUB_TOKEN cannot read either — it is scoped to
      # the caller — so pnpm needs a credential of its own. The rewrite is
      # pinned to those two repositories so the token is never offered to any
      # other github.com fetch, the checkouts above included.
      - name: Authenticate ql-pipeline's private git dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::warning::GH_PACKAGES_TOKEN is not set - installing ql-pipeline will fail to fetch its private git dependencies."
            exit 0
          fi
          for repo in 0xb1te/ql-docs 0xb1te/ql-auth; do
            git config --global "url.https://x-access-token:$GH_PACKAGES_TOKEN@github.com/$repo.insteadOf" "https://github.com/$repo"
          done

      - name: Install and build ql-pipeline
        working-directory: .ql-pipeline
        run: pnpm install --frozen-lockfile --ignore-workspace && pnpm run build

      - name: Run test gate
        run: node .ql-pipeline/dist/main.js gate --stage test --report gate-reports/test.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PIPELINE_CONFIG_PATH: ${{ inputs.config-path }}

      # `always()` so a failing gate still hands its output to the pipeline
      # job, which needs the error text to drive a fix.
      - name: Upload test gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-test
          path: gate-reports/test.json
          if-no-files-found: ignore
          retention-days: 1

  # ---------------------------------------------------------------- 2/6 --
  build:
    name: build
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      QL_PIPELINE_PR_NUMBER: ${{ needs.resolve.outputs.number }}
      QL_PIPELINE_PR_TITLE: ${{ needs.resolve.outputs.title }}
      QL_PIPELINE_PR_HEAD_REF: ${{ needs.resolve.outputs.head-ref }}
      QL_PIPELINE_PR_HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
      QL_PIPELINE_PR_BASE_REF: ${{ needs.resolve.outputs.base-ref }}
      QL_PIPELINE_PR_IS_FORK: ${{ needs.resolve.outputs.is-fork }}
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.head-repo }}
          ref: ${{ needs.resolve.outputs.head-ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Checkout ql-pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.ql-pipeline-repo }}
          ref: ${{ needs.resolve.outputs.ql-pipeline-ref }}
          path: .ql-pipeline

      - name: Hide the ql-pipeline checkout from the repo under review
        run: echo '/.ql-pipeline/' >> .git/info/exclude

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .ql-pipeline/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: .ql-pipeline/pnpm-lock.yaml

      - name: Authenticate ql-pipeline's private git dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::warning::GH_PACKAGES_TOKEN is not set - installing ql-pipeline will fail to fetch its private git dependencies."
            exit 0
          fi
          for repo in 0xb1te/ql-docs 0xb1te/ql-auth; do
            git config --global "url.https://x-access-token:$GH_PACKAGES_TOKEN@github.com/$repo.insteadOf" "https://github.com/$repo"
          done

      - name: Install and build ql-pipeline
        working-directory: .ql-pipeline
        run: pnpm install --frozen-lockfile --ignore-workspace && pnpm run build

      - name: Run build gate
        run: node .ql-pipeline/dist/main.js gate --stage build --report gate-reports/build.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PIPELINE_CONFIG_PATH: ${{ inputs.config-path }}

      - name: Upload build gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-build
          path: gate-reports/build.json
          if-no-files-found: ignore
          retention-days: 1

  # ---------------------------------------------------------------- 3/6 --
  ql-pipeline:
    name: ql-pipeline
    needs: [resolve, test, build]
    # `govern` sets this on an awaiting-human verdict for a repository that can be
    # previewed; the `preview` job below keys off it. Empty on every other path.
    outputs:
      deploy-preview: ${{ steps.govern.outputs.deploy-preview }}
    # Runs even when a gate failed (but not when the run was cancelled):
    # the gate results become findings the fix agent can act on. Halting
    # here on a red gate would mean a broken build is never auto-fixed.
    #
    # The resolve check has to be spelled out beside `!cancelled()`, which
    # would otherwise run this job on the skipped gates of a declined run.
    if: ${{ !cancelled() && needs.resolve.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      QL_PIPELINE_PR_NUMBER: ${{ needs.resolve.outputs.number }}
      QL_PIPELINE_PR_TITLE: ${{ needs.resolve.outputs.title }}
      QL_PIPELINE_PR_HEAD_REF: ${{ needs.resolve.outputs.head-ref }}
      QL_PIPELINE_PR_HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
      QL_PIPELINE_PR_BASE_REF: ${{ needs.resolve.outputs.base-ref }}
      QL_PIPELINE_PR_IS_FORK: ${{ needs.resolve.outputs.is-fork }}
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.head-repo }}
          ref: ${{ needs.resolve.outputs.head-ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Checkout ql-pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.ql-pipeline-repo }}
          ref: ${{ needs.resolve.outputs.ql-pipeline-ref }}
          path: .ql-pipeline

      - name: Hide the ql-pipeline checkout from the repo under review
        run: echo '/.ql-pipeline/' >> .git/info/exclude

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .ql-pipeline/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: .ql-pipeline/pnpm-lock.yaml

      - name: Authenticate ql-pipeline's private git dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::warning::GH_PACKAGES_TOKEN is not set - installing ql-pipeline will fail to fetch its private git dependencies."
            exit 0
          fi
          for repo in 0xb1te/ql-docs 0xb1te/ql-auth; do
            git config --global "url.https://x-access-token:$GH_PACKAGES_TOKEN@github.com/$repo.insteadOf" "https://github.com/$repo"
          done

      - name: Install and build ql-pipeline
        working-directory: .ql-pipeline
        run: pnpm install --frozen-lockfile --ignore-workspace && pnpm run build

      # A gate job that was skipped leaves no artifact; the pipeline job
      # treats an absent report as "that stage did not report", which is
      # different from "that stage passed".
      - name: Download gate reports
        uses: actions/download-artifact@v4
        with:
          pattern: gate-report-*
          merge-multiple: true
          path: gate-reports
        continue-on-error: true

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Cursor CLI is on PATH
        run: cursor-agent --version

      # The fix agent commits through pipeline code, so the runner needs a
      # git identity or `git commit` fails outright.
      - name: Configure git identity for fix commits
        run: |
          git config user.name 'ql-pipeline[bot]'
          git config user.email 'ql-pipeline[bot]@users.noreply.github.com'

      - name: Review, decide, and act
        id: govern
        run: node .ql-pipeline/dist/main.js govern --reports gate-reports
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PIPELINE_CONFIG_PATH: ${{ inputs.config-path }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          QL_PIPELINE_AGENT_API_KEY: ${{ secrets.QL_PIPELINE_AGENT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QL_HOUSE_API_URL: ${{ secrets.QL_HOUSE_API_URL }}
          # Both names are forwarded and `readHouseCredentialsFromEnv` decides
          # precedence, rather than a `||` here: the code is what is tested,
          # and a consumer that sets only the old one must still work.
          HOUSE_API_URL: ${{ secrets.HOUSE_API_URL }}
          QL_AUTH_URL: ${{ secrets.QL_AUTH_URL }}
          QL_AUTH_CLIENT_ID: ${{ secrets.QL_AUTH_CLIENT_ID }}
          QL_AUTH_CLIENT_SECRET: ${{ secrets.QL_AUTH_CLIENT_SECRET }}
          QL_PROXY_TOKEN: ${{ secrets.QL_PROXY_TOKEN }}
          # Each protected exposure holds a secret of its own, so the two hops do
          # not necessarily share one. Both are forwarded and the code picks per
          # hop, falling back to QL_PROXY_TOKEN - a fleet behind one exposure
          # sets neither and is unaffected.
          QL_AUTH_PROXY_TOKEN: ${{ secrets.QL_AUTH_PROXY_TOKEN }}
          QL_HOUSE_PROXY_TOKEN: ${{ secrets.QL_HOUSE_PROXY_TOKEN }}
          # Only the govern step tells anybody what it decided; the gates have no verdict yet.
          # Both absent is the ordinary case for a fleet with no ql-sprint, and nothing fails.
          QL_SPRINT_URL: ${{ secrets.QL_SPRINT_URL }}
          QL_SPRINT_PROXY_TOKEN: ${{ secrets.QL_SPRINT_PROXY_TOKEN }}

  # ---------------------------------------------------------------- 4/6 --
  # A green pull request gets a preview. `govern` sets `deploy-preview` only on an
  # awaiting-human verdict for a repository whose devops folder satisfies the
  # contract and whose branch names a task folder with a seed - so this job never
  # runs for a red, blocked, merged, fork or unpreviewable pull request, and says
  # nothing on the PR in any of those cases rather than posting an empty summary.
  #
  # `runs-on: [self-hosted, ql-proxy]`, unlike every job above it. ql-proxy builds
  # from a directory already on the preview host, so the checkout has to happen
  # there. That also means this job executes on somebody's actual machine, which
  # is why the fork guard is spelled out here as well as in the flag: a fork's
  # workflow content is attacker-controlled.
  #
  # ql-proxy's own `gh pr comment` announces the address. It is handed
  # `github.token` and never GH_TOKEN, on purpose: that comment carries no
  # automation marker, so it has to arrive as github-actions[bot] - which `resolve`
  # declines - rather than as the person GH_TOKEN belongs to, whose comments start
  # another run. The pipeline's own summary (URL, token, expiry, MCP state) is
  # posted by the command below and carries the marker.
  preview:
    name: preview
    needs: [resolve, ql-pipeline]
    if: >-
      ${{ !cancelled()
      && needs.resolve.outputs.run == 'true'
      && needs.resolve.outputs.is-fork == 'false'
      && needs.ql-pipeline.result == 'success'
      && needs.ql-pipeline.outputs.deploy-preview == 'true' }}
    runs-on: [self-hosted, ql-proxy]
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      url: ${{ steps.deploy.outputs.url }}
      project: ${{ steps.deploy.outputs.project }}
      mcp-url: ${{ steps.deploy.outputs.mcp-url }}
      mcp-ready: ${{ steps.deploy.outputs.mcp-ready }}
    env:
      QL_PIPELINE_PR_NUMBER: ${{ needs.resolve.outputs.number }}
      QL_PIPELINE_PR_TITLE: ${{ needs.resolve.outputs.title }}
      QL_PIPELINE_PR_HEAD_REF: ${{ needs.resolve.outputs.head-ref }}
      QL_PIPELINE_PR_HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
      QL_PIPELINE_PR_BASE_REF: ${{ needs.resolve.outputs.base-ref }}
      QL_PIPELINE_PR_IS_FORK: ${{ needs.resolve.outputs.is-fork }}
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.head-repo }}
          ref: ${{ needs.resolve.outputs.head-ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Checkout ql-pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.ql-pipeline-repo }}
          ref: ${{ needs.resolve.outputs.ql-pipeline-ref }}
          path: .ql-pipeline

      - name: Hide the ql-pipeline checkout from the repo under review
        run: echo '/.ql-pipeline/' >> .git/info/exclude

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .ql-pipeline/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: .ql-pipeline/pnpm-lock.yaml

      - name: Authenticate ql-pipeline's private git dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::warning::GH_PACKAGES_TOKEN is not set - installing ql-pipeline will fail to fetch its private git dependencies."
            exit 0
          fi
          for repo in 0xb1te/ql-docs 0xb1te/ql-auth; do
            git config --global "url.https://x-access-token:$GH_PACKAGES_TOKEN@github.com/$repo.insteadOf" "https://github.com/$repo"
          done

      - name: Install and build ql-pipeline
        working-directory: .ql-pipeline
        run: pnpm install --frozen-lockfile --ignore-workspace && pnpm run build

      # Hands infrastructure/docker/environments/devops/ to ql-proxy as the build
      # root, with QL_TASK_FOLDER set so the database boots from the branch's own
      # seed.sql; then finds the application's MCP server on the preview host's
      # container network, waits for it to answer, and posts one summary with the
      # URL, the gate token, the expiry and the MCP state.
      - name: Bring the preview up
        id: deploy
        run: node .ql-pipeline/dist/main.js deploy-preview
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PIPELINE_CONFIG_PATH: ${{ inputs.config-path }}
          # Where the CLI lives on the preview host, and which config it reads.
          # Repository variables on the consumer, because only that repository's
          # operator knows the host.
          QL_PROXY_HOME: ${{ vars.QL_PROXY_HOME }}
          QL_PROXY_CONFIG: ${{ vars.QL_PROXY_CONFIG }}
          # github.token, never GH_TOKEN - see the job comment.
          QL_PREVIEW_ANNOUNCE_TOKEN: ${{ github.token }}

  # ---------------------------------------------------------------- 5/6 --
  # The last job in the chain: a green pull request with a live preview, seeded
  # from its own task's seed.sql, driven over MCP so an agent can say what broke.
  #
  # Runs whenever the preview job brought a stack up - not merely when it
  # completed - and even when that job could not locate the MCP server: the
  # command then fails loudly on the empty address, which is the right report. A
  # surface an agent cannot reach is a surface nobody can test, and a tester that
  # skipped quietly would report success it did not earn.
  #
  # `runs-on: [self-hosted, ql-proxy]` is not an optimisation, it is the security
  # boundary. The job reaches the application's MCP server over the preview
  # host's container network, on the same host as the preview. That surface is
  # never publicly routed: the preview URL's only lock is a gate token meant for
  # showing somebody a demo, and a token that opens a demo must not also open a
  # tool that can read every user. See ql-docs `workflow/flows/app-mcp-surface.md`.
  preview-tester:
    name: preview-tester
    needs: [resolve, preview]
    if: >-
      ${{ !cancelled()
      && needs.resolve.outputs.run == 'true'
      && needs.preview.result == 'success'
      && needs.preview.outputs.deployed == 'true' }}
    runs-on: [self-hosted, ql-proxy]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      QL_PIPELINE_PR_NUMBER: ${{ needs.resolve.outputs.number }}
      QL_PIPELINE_PR_TITLE: ${{ needs.resolve.outputs.title }}
      QL_PIPELINE_PR_HEAD_REF: ${{ needs.resolve.outputs.head-ref }}
      QL_PIPELINE_PR_HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
      QL_PIPELINE_PR_BASE_REF: ${{ needs.resolve.outputs.base-ref }}
      QL_PIPELINE_PR_IS_FORK: ${{ needs.resolve.outputs.is-fork }}
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.head-repo }}
          ref: ${{ needs.resolve.outputs.head-ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Checkout ql-pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.ql-pipeline-repo }}
          ref: ${{ needs.resolve.outputs.ql-pipeline-ref }}
          path: .ql-pipeline

      - name: Hide the ql-pipeline checkout from the repo under review
        run: echo '/.ql-pipeline/' >> .git/info/exclude

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .ql-pipeline/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: .ql-pipeline/pnpm-lock.yaml

      - name: Authenticate ql-pipeline's private git dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::warning::GH_PACKAGES_TOKEN is not set - installing ql-pipeline will fail to fetch its private git dependencies."
            exit 0
          fi
          for repo in 0xb1te/ql-docs 0xb1te/ql-auth; do
            git config --global "url.https://x-access-token:$GH_PACKAGES_TOKEN@github.com/$repo.insteadOf" "https://github.com/$repo"
          done

      - name: Install and build ql-pipeline
        working-directory: .ql-pipeline
        run: pnpm install --frozen-lockfile --ignore-workspace && pnpm run build

      # Reads the task folder the branch names, drives every MCP Cases row against
      # the preview, and posts ONE comment carrying every failure together - even
      # when the first case fails, and especially then. A per-case comment turns a
      # twenty-case plan into twenty notifications and hands the fix agent twenty
      # prompts for what is usually one root cause.
      - name: Drive the preview over MCP
        run: node .ql-pipeline/dist/main.js test-preview
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PIPELINE_CONFIG_PATH: ${{ inputs.config-path }}
          # The preview job's output: an address on the preview host's container
          # network - http://<container-ip>:<port>/mcp - never the public preview
          # URL. Empty when the server could not be located, which the command
          # reports as a failure rather than a skip.
          QL_PREVIEW_MCP_URL: ${{ needs.preview.outputs.mcp-url }}

  # ---------------------------------------------------------------- 6/6 --
  # Closing the pull request tears its preview down now, rather than when the
  # host's reaper next finds it expired. A courtesy on top of the guarantee: the
  # reaper still collects anything this misses - a cancelled run, a dead runner.
  #
  # Independent of `resolve` on purpose. That job declines a closed pull request
  # (there is nothing to govern), and every job above keys off its `run` output;
  # this one keys off the event itself. The caller has to deliver `closed` in
  # its `pull_request.types` for it to fire at all - the scaffolded caller does.
  preview-teardown:
    name: preview-teardown
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, ql-proxy]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Addressed by pull request rather than by project name: the project name
      # carries the minute the preview was created, which this job never saw.
      # ql-proxy resolves it from its registry and collects every preview the
      # pull request produced, and reports "nothing matched" when there was none.
      - name: Tear the preview down
        run: >-
          node "${{ vars.QL_PROXY_HOME }}/dist/cli/entry/main.js" down
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
        env:
          QL_PROXY_CONFIG: ${{ vars.QL_PROXY_CONFIG }}
