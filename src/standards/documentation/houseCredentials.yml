cns: "1.0"
neuron: houseCredentials
kind: function
region: standards
layer: reader
unit: src/standards/house-credentials.ts

responsibility: >
  Reads the four environment variables govern needs to reach house-api, mints this run's own
  ql-auth client-credentials token, and builds the HouseStandardsReader authenticated with it -
  carrying each hop's own ql-proxy secret, because ql-auth and house-api are separate exposures.

excludes:
  - Being read anywhere gate or the scaffolding commands run - only govern ever needs house-api, so only it reads these

receptors: []

effectors:
  - kind: http-out
    target: "{QL_AUTH_URL} client-credentials token endpoint"
    signal: createHouseStandardsReader
    effect: mints a github_agent-authority access token this run uses for every house-api call it makes

signals:
  - signal: readHouseCredentialsFromEnv
    intent: Reads QL_HOUSE_API_URL (falling back to the pre-020 HOUSE_API_URL, reporting which it used on houseApiUrlSource)/QL_AUTH_URL/QL_AUTH_CLIENT_ID/QL_AUTH_CLIENT_SECRET, naming every one that is missing rather than failing on the first.
    accepts: "env? (defaults to process.env)"
    returns: HouseCredentials
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent: []
    raises:
      - code: Error
        when: one or more of the four required environment variables is unset or empty

  - signal: proxyFetchFromEnv
    intent: >
      A fetch that adds the ql-proxy shared secret to every request, or undefined when none is
      configured - an absent token means the exposure is public, not that the run should refuse.
      Reads the named hop's own variable (QL_AUTH_PROXY_TOKEN / QL_HOUSE_PROXY_TOKEN / QL_SPRINT_PROXY_TOKEN) and falls
      back to QL_PROXY_TOKEN, because ql-proxy gives each protected exposure a secret of its own
      and one token sent to both hops is refused at whichever it does not belong to.
    accepts: "env? (defaults to process.env), hop? ('auth' | 'house' | 'sprint')"
    returns: fetch | undefined
    pure: true
    afferent:
      - from: standards.reader.houseCredentials#createHouseStandardsReader
        via: direct-call
      - from: notify.sprint.sprintNotifier#createSprintNotifier
        via: direct-call
      - from: notify.sprint.sprintTasks#readSprintTasks
        via: direct-call
    efferent: []

  - signal: createHouseStandardsReader
    intent: >
      Mints a github_agent client-credentials token from ql-auth, decodes its project_id claim,
      and returns a HouseStandardsReader authenticated against house-api for this run.
    accepts: "HouseCredentials, workspaceRoot, standardsRoot"
    returns: Promise<HouseStandardsReader>
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent:
      - to: standards.reader.houseCredentials#proxyFetchFromEnv
        via: direct-call
        because: each hop is a different ql-proxy exposure holding a different secret, so the auth client and the house client are built with a fetch of their own rather than one shared between them
    raises:
      - code: Error
        when: ql-auth cannot be reached or rejects the client-credentials request, or the minted token has no payload segment to decode

revision: 2026-09-18
