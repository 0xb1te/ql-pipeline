cns: "1.0"
ganglion: verdict.decision
region: verdict
layer: decision
path: src/verdict

role: >
  Turns gate outcomes and review findings into one MERGE/FIX/BLOCK decision - `should`-severity
  findings never block, and a `must`/`security` finding blocks unless every one is auto-fixable
  and attempts remain. Also holds the pure checks that manufacture findings rather than weigh them
  - a failed gate, a pull request that answers to no ql-sprint task, a task folder missing the
  artifacts an automated tester needs, and a product repository with no preview environment to
  boot for a pull request.

upstream:
  - entrypoint.cli
  - mcp.server
downstream:
  - routing.router

neurons:
  - id: verdict.decision.verdict
    file: verdict.yml
    unit: ../verdict.ts
  - id: verdict.decision.requiredChecks
    file: requiredChecks.yml
    unit: ../required-checks.ts
  - id: verdict.decision.taskProvenance
    file: taskProvenance.yml
    unit: ../task-provenance.ts
  - id: verdict.decision.taskArtifacts
    file: taskArtifacts.yml
    unit: ../task-artifacts.ts
  - id: verdict.decision.previewEnvironment
    file: previewEnvironment.yml
    unit: ../preview-environment.ts

revision: 2026-09-22
