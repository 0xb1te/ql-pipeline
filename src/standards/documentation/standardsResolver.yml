cns: "1.0"
neuron: standardsResolver
kind: function
region: standards
layer: reader
unit: src/standards/standards-resolver.ts

responsibility: >
  Loads the ql-docs workflow/review/pr-* pack for a PR's kind and areas through an
  injected StandardsReader port. Pack paths are a convention, not a config map.
  Each document is budgeted so a large checklist cannot crowd the diff out of the
  reviewer prompt.

owns:
  - The StandardsReader port both the local-filesystem default and HouseStandardsReader implement
  - The workflow/review/${kind}/checklist.md plus ${kind}/${area}.md path convention
invariants:
  - A pack document that is not found is reported in `missing`, never silently dropped
  - config.docs is never read

receptors: []
effectors: []

signals:
  - signal: standardsIdFor
    intent: Names the reference id findings cite for one area's standards, e.g. frontend.standards.
    accepts: Area
    returns: string
    pure: true
    afferent:
      - from: standards.reader.standardsResolver#reviewPackEntries
        via: direct-call
    efferent: []

  - signal: reviewPackEntries
    intent: Lists the type checklist plus one pack file per area for a review kind.
    accepts: "ReviewKind, readonly Area[]"
    returns: ReviewPackEntry[]
    pure: true
    afferent:
      - from: standards.reader.standardsResolver#resolveStandards
        via: direct-call
      - from: standards.reader.standardsResolver#allReviewDocumentPaths
        via: direct-call
    efferent:
      - to: standards.reader.standardsResolver#standardsIdFor
        via: direct-call
        because: names the citation id for each area file in the pack

  - signal: allReviewDocumentPaths
    intent: Lists every pack file a local .standards checkout must carry for doctor to pass.
    accepts: "none"
    returns: string[]
    pure: true
    afferent:
      - from: entrypoint.cli.scaffoldCommands#runDoctor
        via: direct-call
    efferent:
      - to: standards.reader.standardsResolver#reviewPackEntries
        via: direct-call
        because: the convention list is the three kinds times every area, plus each kind's checklist

  - signal: truncateAtSection
    intent: Truncates text to a budget on a `## ` section boundary where possible, so a dropped tail never leaves a rule half-included.
    accepts: "text, maxChars"
    returns: "{ text, truncated }"
    pure: true
    afferent:
      - from: standards.reader.standardsResolver#resolveStandards
        via: direct-call
    efferent: []

  - signal: describeDroppedSections
    intent: >
      Names what a truncation actually cost, in the operator's terms. A document with no `## `
      headings can still overflow, and saying so beats reporting "0 sections" - which reads as
      "nothing was lost" when something was. Long lists are elided rather than printed whole,
      because a log line nobody finishes is a log line nobody reads.
    accepts: "sections, droppedChars"
    returns: string
    pure: true
    afferent:
      - from: standards.house.standardsResolver#resolveStandards
        via: direct-call
    efferent: []

  - signal: resolveStandards
    intent: >
      Loads the review pack for this kind and the matched areas through the given
      (or default local-filesystem) reader, budgeting each document and reporting
      anything the pack named that was not found.
    accepts: "readonly Area[], StandardsConfig, workspaceRoot, reader?, kind?"
    returns: Promise<StandardsResolution>
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
      - from: entrypoint.cli.scaffoldCommands#runDoctor
        via: direct-call
    efferent:
      - to: standards.reader.standardsResolver#reviewPackEntries
        via: direct-call
        because: the pack path list is the only source of documents to load
      - to: standards.reader.standardsResolver#truncateAtSection
        via: direct-call
        because: enforces the per-document character budget before returning text
      - to: standards.reader.HouseStandardsReader#exists
        via: di
        because: when govern-command supplies a HouseStandardsReader, existence checks reach house-api instead of the local filesystem
      - to: standards.reader.HouseStandardsReader#read
        via: di
        because: when govern-command supplies a HouseStandardsReader, document content is read from house-api instead of the local filesystem

  - signal: standardsIds
    intent: Names the reference ids the reviewer may cite, for the grounding check.
    accepts: "readonly ResolvedStandard[]"
    returns: string[]
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent: []

  - signal: formatStandard
    intent: >
      Renders one resolved document as the reviewer will see it - a header naming the id and the
      source path, and the citation form findings must use against it. Separate from
      formatStandardsForPrompt so a caller can measure one document's true rendered cost without
      building the whole prompt, which is what packing passes by budget needs.
    accepts: standard
    returns: string
    pure: true
    afferent:
      - from: standards.house.standardsResolver#formatStandardsForPrompt
        via: direct-call
      - from: review.reviewer.reviewPasses#standardCost
        via: direct-call
    efferent: []

  - signal: formatStandardsForPrompt
    intent: Renders the resolved standards into the block injected into the reviewer prompt, naming each document's citation id.
    accepts: "readonly ResolvedStandard[]"
    returns: string
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent: []

revision: 2026-09-07
