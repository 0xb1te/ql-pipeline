cns: "1.0"
ganglion: fix.fixer
region: fix
layer: fixer
path: src/fixer

role: >
  Runs one automated fix attempt against blocking findings, by whichever provider the repository
  configured - in process with a coding-agent CLI, hard-reverting any edit to a protected path
  and committing what is left, or dispatched to ql-agents, which does its own committing on its
  own host and reports back a run id.

upstream:
  - entrypoint.cli
  - mcp.server
downstream:
  - review.reviewer
  - shared.core
  - standards.reader

neurons:
  - id: fix.fixer.fixer
    file: fixer.yml
    unit: ../fixer.ts
  - id: fix.fixer.attemptCounter
    file: attemptCounter.yml
    unit: ../attempt-counter.ts
  - id: fix.fixer.complaint
    file: complaint.yml
    unit: ../complaint.ts
  - id: fix.fixer.protectedPaths
    file: protectedPaths.yml
    unit: ../protected-paths.ts
  - id: fix.fixer.agentsFixer
    file: agentsFixer.yml
    unit: ../agents-fixer.ts

revision: 2026-09-22
