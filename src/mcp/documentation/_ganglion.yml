cns: "1.0"
ganglion: mcp.server
region: mcp
layer: server
path: src/mcp

role: >
  Exposes this pipeline to an AI agent over newline-delimited JSON-RPC on stdio, in two halves:
  the maintenance commands (`doctor`/`init`/`upgrade`) are spawned as the already-built CLI, a
  child process per call, while the read-only inspection of a governance run - route, gate
  reports, verdict, human queue - is composed in-process from the engine's own functions.
  `gate` and `govern` themselves are not exposed here; the carve-out and its cost are recorded
  on mcp.server.tools#runTool.

upstream: []
downstream:
  - entrypoint.cli
  - routing.router
  - verdict.decision
  - fix.fixer
  - shared.core

neurons:
  - id: mcp.server.tools
    file: tools.yml
    unit: ../tools.ts
  - id: mcp.server.server
    file: server.yml
    unit: ../server.ts
  - id: mcp.server.inspect
    file: inspect.yml
    unit: ../inspect.ts

revision: 2026-09-21
