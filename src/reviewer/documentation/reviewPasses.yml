cns: "1.0"
neuron: reviewPasses
kind: model
region: review
layer: reviewer
unit: src/reviewer/review-passes.ts

responsibility: >
  Splits the loaded standards across as few review passes as will carry them whole, and collapses
  the findings those passes come back with.

invariants:
  - >
    A set of standards that fits the budget runs in ONE pass, exactly as it did before passes
    existed. Passes are added only when the alternative is dropping text - a second agent call
    that buys nothing is a cost with no verdict attached to it
  - >
    Documents with no area - the shared checklist - ride in every pass. A pass judged without the
    review checklist is judged against a different standard than its siblings

owns:
  - >
    The dedupe key, and the pass boundary that makes it work. Both halves of the old reasoning
    were true and could not both be served by one flat key - the same defect legitimately
    surfaces in two passes, because a layering mistake is visible from the architecture slice
    and from the quality slice; yet two different rules broken on one line really are two
    findings. Including the rule protected the second and sacrificed the first, and the passes
    are what resolve it. A spot an EARLIER pass already anchored is a repeat and is dropped
    whatever rule it cites; within ONE pass the rule still separates two findings, because a
    pass naming two rules on one line is naming two things it actually saw
  - >
    Filling the anchor set only between passes, never during one. Filling it as each finding is
    kept would make the two halves above collide again, silently swallowing a pass's own second
    finding on a line - the exact failure the rule was originally in the key to prevent

excludes:
  - Running a pass, or talking to any agent - callers own that
  - Choosing the budget; entrypoint.cli.governCommand measures it from the prompt template

receptors: []
effectors: []

signals:
  - signal: standardCost
    intent: >
      Bytes this document costs the prompt, rendered exactly as it will appear - including the
      blank line the join adds, so a plan that fills the budget to the brim still fits once joined.
    accepts: standard
    returns: number
    pure: true
    afferent:
      - from: review.reviewer.reviewPasses#planReviewPasses
        via: direct-call
    efferent:
      - to: standards.house.standardsResolver#formatStandard
        via: direct-call
        because: a cost measured on anything but the rendered text is a cost for a different prompt

  - signal: planReviewPasses
    intent: >
      Packs the standards into passes by budget. Task 017 measured what the single-pass design
      actually delivered - 48% of frontend.md reached the reviewer, and the half it lost was the
      engineering half. A verdict formed against half a checklist is not weaker, it is unreadable:
      "Findings: 0" cannot be told apart from "the rule that would have caught it was never in the
      prompt".
    accepts: "standards, budgetBytes"
    returns: ReviewPass[]
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent:
      - to: review.reviewer.reviewPasses#standardCost
        via: direct-call
        because: packing by budget needs the rendered size of each document

  - signal: dedupeFindings
    intent: >
      Collapses the findings the passes came back with. Takes one list per pass rather than one
      flat list, because the pass boundary is the only thing that separates a defect two passes
      both saw from two defects one pass found on the same line. Keyed on file and line across
      passes, and on file, line and rule within one.
    accepts: passes
    returns: Finding[]
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent: []

provenance:
  - docs/017-sliced-review-passes/plan.md
  - docs/bugfixes/045-one-defect-six-times/summary.md

revision: 2026-09-22
