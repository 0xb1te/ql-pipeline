name: Dogfood

# ql-pipeline governs its own PRs through the exact same reusable workflow
# any consumer repo calls (docs/integration-guide.md) — the only difference
# is `config-path`, since this repo keeps its own config at the root
# (pipeline.config.yml) rather than under .github/, and the local `uses:`
# reference instead of a cross-repo one.
#
# The calling job is named `checks`, so the three checks it contributes to
# a PR appear as `checks / test`, `checks / build`, and
# `checks / ql-pipeline`.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# A called workflow can never hold more than its caller. ql-pipeline's jobs
# declare contents/pull-requests/issues write - they label PRs, comment, push
# fix commits and merge - so on a repository whose default GITHUB_TOKEN is
# read-only (GitHub's default) the run fails at startup with NO jobs at all,
# and GitHub exposes no reason for it through the API or the UI. Granting it
# here keeps the widening to this one workflow, rather than flipping the
# repository-wide "Workflow permissions" default and handing write to every
# other workflow in the repo as well.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  checks:
    uses: ./.github/workflows/pr-pipeline.yml
    with:
      config-path: pipeline.config.yml
    # Forward everything this repo holds rather than naming each secret:
    # the set ql-pipeline needs changes over time, and dogfood should not be
    # the one caller that has to be edited when it does.
    secrets: inherit
