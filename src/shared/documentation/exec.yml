cns: "1.0"
neuron: exec
kind: function
region: shared
layer: core
unit: src/shared/exec.ts

responsibility: >
  The real shell-backed CommandExecutor every gate/git-invoking signal is injected with by
  default - runs a trusted, config-defined command string through a shell.

invariants:
  - Only ever fed trusted, config-defined command strings - never PR-derived content (RULES.md R5.4)

receptors: []

effectors:
  - kind: filesystem
    target: a shell, in the given working directory
    signal: defaultCommandExecutor
    effect: runs the given command string through a shell and returns its stdout/stderr

signals:
  - signal: defaultCommandExecutor
    intent: Runs a command string through a shell in the given working directory, returning its stdout/stderr, or rejecting on a non-zero exit.
    accepts: "command, { cwd }"
    returns: "Promise<{ stdout: string; stderr: string }>"
    afferent:
      - from: routing.router.gateRunner#runGates
        via: di
      - from: fix.fixer.fixer#runFix
        via: di
      - from: fix.fixer.protectedPaths#revertProtectedPaths
        via: di
      - from: shared.core.worktree#captureWorktreeState
        via: di
    efferent: []

revision: 2026-08-30
