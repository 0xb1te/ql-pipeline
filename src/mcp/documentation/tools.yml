cns: "1.0"
neuron: tools
kind: function
region: mcp
layer: server
unit: src/mcp/tools.ts

responsibility: >
  Declares the tool list this server exposes - the three maintenance commands it owns, plus the
  read-only inspection tools from mcp.server.inspect - and dispatches a call: an inspection name
  is answered in-process, and anything left is run by spawning the already-built CLI
  (`dist/main.js`) as a child process, exactly as a person at a terminal would. There is still
  no in-process code path for doctor/init/upgrade here.

owns:
  - TOOLS, the tool descriptors tools/list returns verbatim, composed from MAINTENANCE_TOOLS and INSPECT_TOOLS
invariants:
  - >
    The CI-verb carve-out: gate/govern are deliberately not exposed here, and the reason is not
    that they are CI-triggered - it is that they write. govern merges, approves, comments and
    pushes fix commits; gate runs the shell commands named in the config. What makes the
    carve-out survivable is that the reading half now exists (mcp.server.inspect), so learning
    what govern would decide no longer requires causing it. Recorded, not assumed: ql-docs
    GR-04's parity clause admits only a secrets exception, which this is not, so a House
    `problem` is still owed - see docs/features/040-governance-verbs-on-mcp/plan.md.
  - TOOLS is maintenance-first, then inspection, and is pinned by exact-equality assertions in tests/mcp/tools.test.ts and tests/mcp/server.test.ts

receptors: []

effectors:
  - kind: filesystem
    target: "the already-built dist/main.js, spawned with node and no shell"
    signal: runTool
    effect: spawns `node dist/main.js doctor|init|upgrade` in the resolved root directory and captures its stdout, stderr, and exit code as the tool result

signals:
  - signal: runTool
    intent: >
      Resolves a tool call's args to the matching CLI invocation (doctor/init/upgrade,
      forwarding root and, for upgrade, force) and runs it as a child process.
    accepts: "name, args"
    returns: Promise<ToolResult>
    afferent:
      - from: mcp.server.server#dispatch
        via: direct-call
    efferent:
      - to: mcp.server.inspect#runInspectTool
        via: direct-call
        because: an inspection tool name is answered in-process rather than by spawning the CLI

provenance:
  - docs/features/040-governance-verbs-on-mcp/plan.md
  - docs/features/040-governance-verbs-on-mcp/summary.md

revision: 2026-09-21
