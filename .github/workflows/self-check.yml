name: Self-check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: self-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No hard `version:` — it contradicts package.json's `packageManager`
      # field and pnpm refuses to guess between them (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ql-pipeline installs @0xb1te/house-client and @0xb1te/ql-auth-client
      # straight from the private 0xb1te/ql-docs and 0xb1te/ql-auth repos.
      # The calling repo's GITHUB_TOKEN cannot read either — it is scoped to
      # the caller — so pnpm needs a credential of its own. The rewrite is
      # pinned to those two repositories so the token is never offered to any
      # other github.com fetch, the checkouts above included.
      - name: Authenticate ql-pipeline's private git dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::warning::GH_PACKAGES_TOKEN is not set - installing ql-pipeline will fail to fetch its private git dependencies."
            exit 0
          fi
          for repo in 0xb1te/ql-docs 0xb1te/ql-auth; do
            git config --global "url.https://x-access-token:$GH_PACKAGES_TOKEN@github.com/$repo.insteadOf" "https://github.com/$repo"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # ql-pipeline reports other repositories for leaving their neuron docs behind a change.
      # Five of its own units had drifted before this step existed, two of them in the commit
      # that taught the reviewer to look for it.
      - name: Neuron docs match the code
        run: pnpm run neurons

      - name: Build
        run: pnpm run build

      # dist/ is committed (not gitignored) so `pnpm add github:...` never
      # needs to run an install-time build script — pnpm 10+ blocks git
      # dependencies from running lifecycle scripts by default, which
      # otherwise breaks the whole install (docs/011-*/plan.md). That only
      # holds if the committed dist/ actually matches src/, so a PR that
      # changes src/ without rebuilding dist/ fails here.
      - name: Verify committed dist/ matches source
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ does not match src/. Run 'pnpm run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi

      - name: Test
        run: pnpm test
