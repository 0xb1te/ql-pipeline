# ql-pipeline's own configuration — this repo governs its own PRs through
# the same reusable workflow a consumer calls (.github/workflows/dogfood.yml).
#
# It also serves as a worked example of the schema. A consumer repo keeps
# its own copy at .github/pipeline.config.yml; every key except
# `merge.target_branch` is optional and falls back to the default noted
# beside it. See docs/integration-guide.md §4 and src/shared/config.ts.

# Build/test commands per area. An area with no entry here is simply
# ungated — ql-pipeline cannot guess a repo's build commands, so there is
# no default. Commands run through a shell (they need `&&` and pipes) and
# come only from this trusted, R4-protected file, never from PR content.
#
# These are ql-pipeline's REAL gates, not illustrations. Only the two areas
# this repo routes to are listed: R2.1 puts all pipeline work in
# `infrastructure`, and prose in `docs`. An area left out is ungated, which
# is the honest state for code this repo does not contain — a placeholder
# command that cannot run is worse than no gate, because it fails the PR and
# takes the AI review down with it ("skipping AI review: a required gate
# failed"). Task 018 exists because `infrastructure` was `tflint && checkov`
# on a TypeScript repo, so this pipeline had never once reviewed its own code.
#
# For the other areas, see the two complete `gates:` blocks in
# docs/integration-guide.md §4. The shape, for reference:
#
#   frontend:
#     build: "npm ci && npm run build"
#     test: "npm run test -- --ci"
#   backend:
#     build: "npm ci && npm run build"
#     test: "npm run test:unit && npm run test:integration"
#   mobile:
#     build: "npm ci && npm run build"
#     test: "npm test -- --ci"
#   ios:
#     build: "xcodebuild -scheme App -configuration Debug build"
#     test: "xcodebuild -scheme App -configuration Debug test"
#   android:
#     build: "./gradlew assembleDebug"
#     test: "./gradlew testDebugUnitTest"
gates:
  infrastructure:
    # `pnpm install` resolves this repo's private git dependencies because
    # pr-pipeline.yml configures the GH_PACKAGES_TOKEN URL rewrite globally
    # before the gate step runs, in all three jobs.
    build: "pnpm install --frozen-lockfile && pnpm run build"
    # typecheck and lint belong in the TEST gate, not just in self-check.yml:
    # this result is what feeds MERGE/BLOCK, and a gate that ran only `pnpm
    # test` would let the pipeline approve a PR that does not compile. The
    # overlap with CI is deliberate - one is the check, this is the evidence.
    test: "pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run lint && pnpm test"
  docs:
    # Nothing to build or test in prose; `true` is a real command that really
    # succeeds, which is the point - it is not a stub that happens to work.
    build: "true"
    test: "true"

merge:
  # Required. The pipeline governs only PRs that target this branch; a PR
  # aimed anywhere else is left untouched rather than failed.
  target_branch: main

  # Optional per-area override of target_branch. A PR whose areas resolve
  # to more than one target is a conflict the pipeline refuses to guess at.
  # target_branch_by_area:
  #   mobile: release/mobile

  method: merge              # squash | merge | rebase   (default: merge)
  delete_branch: true        # default: true

  # Which pipeline stages are enforced. A stage left out still runs, but
  # its failures are advisory rather than blocking — except `ai-review`,
  # which is skipped entirely when not required, since a review whose
  # findings cannot block is pure cost.
  required_checks: [build, test, ai-review]   # default: all three

  # A MERGE verdict labels the PR `ready-to-merge` and stops. Everything the
  # pipeline learns still reaches the PR; only the last step is a person's.
  #
  # ql-desktop took this in its task 040 after #32 merged itself on that
  # repo's default branch while nobody was watching. The same reasoning
  # applies here with more force, not less: task 027 gave the loop a mouth —
  # a comment now starts a run that can review, fix, push and decide — and
  # this is the repository every other one calls at `@main`, so a merge here
  # changes how every governed repo behaves within the minute. An agent that
  # can both change the code and merge it leaves no moment where a human
  # sees the result.
  require_human_approval: true

# Areas are detected from conventional-commit headers, and additionally
# from the paths a PR touches. Path detection is additive: a commit
# labelled `feat(frontend)` that also edits `apps/api-backend/` still gets
# the backend rules and standards applied. It cannot rescue a PR with no
# valid commit header — commit hygiene stays mandatory.
areas:
  paths:
    frontend: ["apps/*frontend*/**"]
    backend: ["apps/*backend*/**"]

# Review criteria come from ql-docs workflow/review/pr-*, chosen by branch
# prefix (features → pr-feature, hotfixes → pr-fix, bugfixes → pr-bugfix).
# There is no standards.docs path map; that key is ignored if present.
standards:
  enabled: true
  root: .standards
  # Sized so no pack file truncates. Lower it to cut review cost, at the
  # price of dropping trailing sections (cut on a section boundary).
  max_chars_per_area: 140000

# This repo stays on the Cursor CLI (default provider). openai_compatible
# is review-only and would disable the fixer. Slug is the cursor-agent
# --list-models id, not the product display name.
agent:
  # cursor            - spawns cursor-agent in the governance job. Reviews and fixes.
  # openai_compatible - review only; the fixer still needs a real agent.
  # ql_agents         - dispatches the fix to ql-agents instead of spawning a CLI here, so
  #                     which coding agent runs is a descriptor on that side rather than a code
  #                     path in this repo. Needs QL_AGENTS_URL, QL_AGENTS_WORKTREE_BASE and the
  #                     QL_AUTH_* credentials; the model below is forwarded to the run.
  #                     Note it cannot revert protected paths the way `cursor` does - ql-agents
  #                     pushes from its own host - so R4 on the triggered run is the backstop.
  #                     See docs/features/046-fix-through-ql-agents/.
  provider: cursor
  # Fallback for every phase. Override one phase at a time with
  # `review.model` / `fix.model` - review reasons about a whole diff against
  # the checklists, a fix just applies a complaint that is already reasoned
  # out, so they do not need the same model.
  model: cursor-grok-4.6-xhigh-fast
  # review:
  #   model: cursor-grok-4.6-xhigh-fast
  # fix:
  #   model: cursor-auto

fixer:
  max_fix_attempts: 3
  # Whether a `should` finding gets an agent, or only a comment. On by default.
  # An advisory finding still never blocks a merge - every guard falls back to
  # MERGE, never BLOCK - what changes is that somebody is assigned to it. A
  # failed gate the repo left out of `required_checks` is deliberately excluded:
  # that one is advisory by configuration, not by judgement.
  # fix_advisory: true
  # An explicit override, not the shipped default: this file governs
  # ql-pipeline's own repo, so the pipeline's own rules/prompts/config/
  # workflows are exactly what needs protecting here. A consumer repo has
  # no rules/ or prompts/ folder of its own — see DEFAULT_PROTECTED_PATHS
  # in src/shared/config.ts for what applies when a consumer omits this.
  #
  # These paths are enforced twice over: a PR touching them always routes
  # to a human, and any fix-agent edit to them is hard-reverted before a
  # commit is made (RULES.md R4).
  protected_paths:
    - rules/
    - prompts/
    - pipeline.config.yml
    - .github/workflows/

# ql-pipeline has no apps/ directory and therefore no preview environment: the
# `preview` job never runs for this repository, whatever this block says. Kept
# explicit so the dogfood run states it rather than relying on the default.
preview:
  enabled: false
