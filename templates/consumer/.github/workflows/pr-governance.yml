name: PR Governance

# Managed by ql-pipeline — regenerated by `ql-pipeline upgrade`.
# Local edits are detected and preserved (upgrade will refuse to overwrite
# them and tell you), but they will drift from the template over time.
# Prefer configuring behaviour in .github/pipeline.config.yml instead.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new commit cancels the in-flight run for the previous one, including a
# stale fix-loop attempt. This belongs to the caller, not the reusable
# workflow, because it is a property of *this* repo's runs.
concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job id becomes the check-name prefix: `checks / test`, `checks / build`,
  # `checks / ql-pipeline`. Those exact strings go into branch protection.
  checks:
    uses: 0xb1te/ql-pipeline/.github/workflows/pr-pipeline.yml@main
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # The engineering standards the reviewer applies come from house-api,
      # not a checkout — a github_agent client-credentials client. Only
      # needed while standards.enabled is true in pipeline.config.yml.
      HOUSE_API_URL: ${{ secrets.HOUSE_API_URL }}
      QL_AUTH_URL: ${{ secrets.QL_AUTH_URL }}
      QL_AUTH_CLIENT_ID: ${{ secrets.QL_AUTH_CLIENT_ID }}
      QL_AUTH_CLIENT_SECRET: ${{ secrets.QL_AUTH_CLIENT_SECRET }}
      # Optional. Supply a PAT/App token so fix commits re-trigger the
      # pipeline; with the default token they land but are not re-reviewed.
      # GH_TOKEN: ${{ secrets.GH_TOKEN }}
