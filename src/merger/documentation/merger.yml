cns: "1.0"
neuron: merger
kind: function
region: merge
layer: merger
unit: src/merger/merger.ts

responsibility: >
  Carries out a MERGE verdict: re-checks the head commit is still the one reviewed, records the
  verdict on the PR - approving it where GitHub permits that and commenting where it does not -
  merges (or just labels, in human-approval mode), and deletes the branch if configured to.

invariants:
  - The staleness check always runs before the verdict is recorded, and the merge call is pinned to the reviewed head SHA so GitHub itself rejects a merge if a newer commit landed mid-run
  - >
    Only a refusal that is both 422 and names the PR's own author degrades to a comment review.
    Every other failure rethrows, because a review that did not land is a governance run that did
    not do its job, and a blanket downgrade would hide that behind a comment

receptors: []
effectors: []

signals:
  - signal: findingToReviewComment
    intent: Renders a should-severity finding as an advisory PR review comment.
    accepts: Finding
    returns: ReviewComment
    pure: true
    afferent:
      - from: merge.merger.merger#inlineComments
        via: direct-call
    efferent: []

  - signal: isDiffAnchored
    intent: >
      Whether a finding points at a line GitHub will accept an inline review comment on. Not every
      finding is about a line of code - a failed gate carries the pseudo-path `(gate)` and a pull
      request that answers to no ql-sprint task carries `(task)`, because what they are about is
      the pull request itself. GitHub rejects a review comment whose path is not in the diff with a
      422, and isSelfReviewRefusal deliberately rethrows it, so one advisory finding with nowhere
      to point would fail a run that had otherwise passed - the exact opposite of what `should`
      severity means. The parenthesised spelling is the marker because it cannot collide with a
      real path.
    accepts: Finding
    returns: boolean
    pure: true
    afferent:
      - from: merge.merger.merger#inlineComments
        via: direct-call
      - from: merge.merger.merger#unanchoredFindings
        via: direct-call
    efferent: []

  - signal: inlineComments
    intent: >
      The findings that can be inline comments, as inline comments. Both review paths post comments
      and both must apply the same rule, so the rule lives here rather than at each call site. It
      was written for the approval path and not applied to the blocking one, which is how a failed
      required gate - `must` severity, pseudo-path `(gate)` - reached requestChangesWithComments and
      422'd the run it was supposed to be explaining. That is the worst possible moment to throw,
      because the complaint is the only thing the pull request was going to get. Callers are
      responsible for reporting what this drops; it returns comments rather than a verdict, and a
      finding missing from both the comments and the body would be worse than the 422.
    accepts: "readonly Finding[]"
    returns: "ReviewComment[]"
    pure: true
    afferent:
      - from: merge.merger.merger#executeMergeDecision
        via: direct-call
      - from: entrypoint.cli.governCommand#complaintReview
        via: direct-call
    efferent:
      - to: merge.merger.merger#isDiffAnchored
        via: direct-call
        because: the one rule for whether GitHub will accept a comment on this finding's path
      - to: merge.merger.merger#findingToReviewComment
        via: direct-call
        because: renders each surviving finding as the review comment it will be posted as

  - signal: unanchoredFindings
    intent: >
      The findings this pull request cannot carry as inline comments, so a caller can report them
      somewhere a reader will still see. Exactly the complement of inlineComments - a finding in
      neither is one the pull request never mentions at all.
    accepts: "readonly Finding[]"
    returns: "Finding[]"
    pure: true
    afferent:
      - from: merge.merger.merger#executeMergeDecision
        via: direct-call
      - from: entrypoint.cli.governCommand#complaintReview
        via: direct-call
    efferent:
      - to: merge.merger.merger#isDiffAnchored
        via: direct-call
        because: the same rule, read the other way round

  - signal: isSelfReviewRefusal
    intent: >
      Whether GitHub refused a review because the token's owner opened the pull request. Matched
      on the status and the message together: 422 alone covers several unrelated validation
      failures - a comment on a line outside the diff, most commonly - and treating one of those
      as "this is my own PR" would swallow a real error and post a comment review in its place.
      Reachable only since GH_TOKEN became a person's token; as github-actions[bot] the pipeline
      authors nothing and may approve anything. Named for the review rather than the approval
      because GitHub refuses both halves the same way - approving your own pull request and
      requesting changes on it - and for a long time only the approving half consulted this.
    accepts: unknown
    returns: boolean
    pure: true
    afferent:
      - from: merge.merger.merger#executeMergeDecision
        via: direct-call
      - from: merge.merger.merger#recordComplaint
        via: direct-call
    efferent: []

  - signal: recordComplaint
    intent: >
      Posts the FIX or BLOCK complaint, requesting changes where GitHub permits it and commenting
      where it does not. The exact shape of the approval path's fallback, and for the exact same
      reason - which is the point. GitHub refuses both self-reviews with one 422, only the
      approving half was ever caught, and so every FIX and BLOCK verdict on a pull request the
      token's owner had opened threw out of requestChangesWithComments before posting anything.
      The check went red by crashing rather than by deciding, leaving no findings on the pull
      request, no threads for the fixer to answer, and a summary comment reporting findings nobody
      could read. The threads come back either way, so the fix loop is untouched, and the merge is
      still blocked by this run failing its own required check rather than by the review state.
    accepts: "GithubClient, PullRequestInfo, body, readonly ReviewComment[]"
    returns: "threads and outcome"
    pure: false
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent:
      - to: merge.merger.merger#isSelfReviewRefusal
        via: direct-call
        because: only that one refusal may degrade the complaint to a comment; everything else rethrows
      - to: shared.core.githubClient#createGithubClient
        via: di
        because: requestChangesWithComments and commentReviewWithThreads are whatever createGithubClient's Octokit-backed implementation returns

  - signal: recordVerdictLabel
    intent: >
      Puts the verdict a run reached on the pull request and takes off the one it did not, so the two
      labels this pipeline uses for "what happened here" stay mutually exclusive. They were only ever
      added, so a pull request could end a run wearing both - not a richer answer but two answers, one
      of them false. ql-desktop#72 finished with needs-human and ready-to-merge together, after an
      early run escalated over a protected path and a later run approved once that path was narrowed.
      Adds before it removes, deliberately: the other order leaves a window in which the pull request
      carries no verdict at all.
    accepts: "GithubClient (subset), PullRequestInfo (subset), verdict label"
    returns: Promise<void>
    afferent:
      - from: merge.merger.merger#executeMergeDecision
        via: direct-call
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent:
      - to: shared.core.githubClient#createGithubClient
        via: di
        because: addLabels and removeLabel are whatever createGithubClient's Octokit-backed implementation returns

  - signal: executeMergeDecision
    intent: >
      Re-checks the PR's head commit is unchanged, records the verdict with any advisory comments
      attached, and merges (or labels ready-to-merge without merging, in human-approval mode),
      deleting the branch if configured to. The verdict is an approving review where GitHub allows
      one and a COMMENT review where it does not, because nobody may approve a pull request they
      opened themselves. MergeExecution carries which of the two happened, so no caller has to
      infer it from silence - and a COMMENT review cannot satisfy branch protection that requires
      an approval, which the note it posts says outright.
    accepts: "GithubClient, PullRequestInfo (subset), readonly Finding[], MergeConfig"
    returns: Promise<MergeExecution>
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent:
      - to: merge.merger.merger#findingToReviewComment
        via: direct-call
        because: renders each advisory finding as a review comment attached to the verdict
      - to: merge.merger.merger#isDiffAnchored
        via: direct-call
        because: a finding about the pull request rather than a line in it is posted as an ordinary comment, because sent inline it is a 422 that would cost the approval it was riding along on
      - to: merge.merger.merger#isSelfReviewRefusal
        via: direct-call
        because: only that one refusal may degrade an approval to a comment; everything else rethrows
      - to: merge.merger.merger#recordVerdictLabel
        via: direct-call
        because: a run that approves has to take off an earlier escalation, or the pull request carries both verdicts at once
      - to: shared.core.githubClient#createGithubClient
        via: di
        because: getHeadSha/approveWithComments/commentReview/postComment/addLabels/mergePullRequest/deleteBranch are whatever createGithubClient's Octokit-backed implementation returns

revision: 2026-09-20
