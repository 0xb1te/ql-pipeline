cns: "1.0"
neuron: houseCredentials
kind: function
region: standards
layer: reader
unit: src/standards/house-credentials.ts

responsibility: >
  Reads the four environment variables govern needs to reach house-api, mints this run's own
  ql-auth client-credentials token, and builds the HouseStandardsReader authenticated with it.

excludes:
  - Being read anywhere gate or the scaffolding commands run - only govern ever needs house-api, so only it reads these

receptors: []

effectors:
  - kind: http-out
    target: "{QL_AUTH_URL} client-credentials token endpoint"
    signal: createHouseStandardsReader
    effect: mints a github_agent-authority access token this run uses for every house-api call it makes

signals:
  - signal: readHouseCredentialsFromEnv
    intent: Reads HOUSE_API_URL/QL_AUTH_URL/QL_AUTH_CLIENT_ID/QL_AUTH_CLIENT_SECRET, naming every one that is missing rather than failing on the first.
    accepts: "env? (defaults to process.env)"
    returns: HouseCredentials
    pure: true
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent: []
    raises:
      - code: Error
        when: one or more of the four required environment variables is unset or empty

  - signal: createHouseStandardsReader
    intent: >
      Mints a github_agent client-credentials token from ql-auth, decodes its project_id claim,
      and returns a HouseStandardsReader authenticated against house-api for this run.
    accepts: "HouseCredentials, workspaceRoot, standardsRoot"
    returns: Promise<HouseStandardsReader>
    afferent:
      - from: entrypoint.cli.governCommand#runGovern
        via: direct-call
    efferent: []
    raises:
      - code: Error
        when: ql-auth cannot be reached or rejects the client-credentials request, or the minted token has no payload segment to decode

revision: 2026-08-30
