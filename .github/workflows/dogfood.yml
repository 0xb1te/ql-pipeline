name: Dogfood

# ql-pipeline governs its own PRs through the exact same reusable workflow
# any consumer repo calls (docs/integration-guide.md) — the only difference
# is `config-path`, since this repo keeps its own config at the root
# (pipeline.config.yml) rather than under .github/, and the local `uses:`
# reference instead of a cross-repo one.
#
# The calling job is named `checks`, so the three checks it contributes to
# a PR appear as `checks / test`, `checks / build`, and
# `checks / ql-pipeline`.
#
# The two comment events are how a person asks for another pass: say what to
# do differently — on the PR, or as a reply inside the thread of the finding
# it concerns — and the same three checks run again with that comment read as
# direction. `issue_comment` arrives without a head ref, which is why the
# reusable workflow resolves the PR itself before checking anything out.
# Comments written by bots are declined there, so the pipeline's own verdicts
# and thread replies cannot start a run.
#
# Two things about `issue_comment` are easy to lose an afternoon to: it fires
# for comments on plain issues as well (declined in `resolve`), and it always
# runs the copy of this file on the DEFAULT branch — never the one on the PR.
# Editing this trigger on a branch does nothing until it is merged.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

concurrency:
  # `issue_comment` carries `issue.number`, `pull_request` carries
  # `pull_request.number`, and they are the same number for the same PR — so the
  # number alone covers both events for one PR.
  # The event belongs in the key as much as the number does. Without it the
  # pipeline's own verdict comment queues a run in this very group, and
  # `cancel-in-progress` kills the run that is posting it - concurrency is
  # evaluated before any job, so the marker guard in `resolve` declines the new
  # run seconds after it has already killed its parent. What that looks like is a
  # red `checks / ql-pipeline` on a pull request the engine approved.
  group: >-
    pr-pipeline-${{ github.event.pull_request.number || github.event.issue.number }}-${{
    github.event_name == 'pull_request' && 'commit' || 'comment' }}
  cancel-in-progress: true

# A called workflow can never hold more than its caller. ql-pipeline's jobs
# declare contents/pull-requests/issues write - they label PRs, comment, push
# fix commits and merge - so on a repository whose default GITHUB_TOKEN is
# read-only (GitHub's default) the run fails at startup with NO jobs at all,
# and GitHub exposes no reason for it through the API or the UI. Granting it
# here keeps the widening to this one workflow, rather than flipping the
# repository-wide "Workflow permissions" default and handing write to every
# other workflow in the repo as well.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  checks:
    uses: ./.github/workflows/pr-pipeline.yml
    with:
      config-path: pipeline.config.yml
    # Forward everything this repo holds rather than naming each secret:
    # the set ql-pipeline needs changes over time, and dogfood should not be
    # the one caller that has to be edited when it does.
    secrets: inherit
